<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brosur Harga Starlink</title>
<style id="appCss">
* { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
:root { --c:#1e3c9c; --c2:#19c3a6; --cl:#eaf3fb; --cp:#cce0f5; --cb:#91b5e5; --on:#fff; --pr:#d9480f;
  --c3:#1b8fd6; --cg: linear-gradient(120deg, var(--c) 0%, var(--c3) 50%, var(--c2) 100%); }
html, body { margin: 0; }
.vroot .hero h1,.title-box h1,.v1 .ch,.v7 .pch{text-shadow:0 1px 3px rgba(0,0,0,.28)}
body { padding: 8px; padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); padding-bottom: max(8px, env(safe-area-inset-bottom)); color: #333; background: #fff; overflow-x: hidden; }

/* ===== Toolbar ===== */
#bar { display: flex; gap: 6px; margin-bottom: 8px; max-width: 950px; margin-left: auto; margin-right: auto; }
#bar button { flex: 1; border: none; border-radius: 8px; padding: 8px 2px; font-size: 13px; white-space: nowrap; font-weight: bold; color: #fff; cursor: pointer; background: #555; }
#bPrint { background: #28a745 !important; }
#bWA { background: #1fa855 !important; }
#bFx { background: #e08a00 !important; }
#bTheme { background: var(--cg) !important; color: var(--on) !important; }
#themePanel { max-width: 950px; margin: 0 auto 8px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #fafafa; }
#themePanel[hidden] { display: none; }
.sw { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #999, 0 2px 5px rgba(0,0,0,.25); padding: 0; cursor: pointer; }
#themePanel label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
#cust { width: 40px; height: 34px; padding: 0; border: 1px solid #999; border-radius: 6px; background: #fff; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #222; color: #fff; padding: 9px 16px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
#toast.on { opacity: .95; }

/* ===== Lembar brosur ===== */
#wrap { max-width: 950px; margin: 0 auto; overflow: hidden; }
body.fit #wrap { max-width: none; }
#sheet { background-color: var(--sbg, #fff); transform-origin: top left; }

.bg-blue { background: var(--cg); color: var(--on); }
.text-blue { color: var(--c); }
.bg-light-blue { background: var(--cl); }
.border-blue { border: 2.5px solid var(--c); }
.rounded { border-radius: 10px; }
.rounded-sm { border-radius: 5px; }

.flex-row { display: flex; gap: 16px; margin-bottom: 10px; }
.flex-col { flex: 1; padding: 12px 16px; text-align: center; min-width: 0; }
.unit-price-box { display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin: 8px 0; }
.paket-line { display: inline-flex; align-items: center; gap: 5px; margin: 5px 0 3px; white-space: nowrap; }

h1, h2, h3, p { margin: 0; }
.title-box { text-align: center; padding: 15px; margin-bottom: 10px; }
.title-box h1 { font-size: 32px; margin-bottom: 4px; }
.title-box p { font-size: 14px; }
.section-header { padding: 8px 15px; font-weight: bold; font-size: 15px; margin-bottom: 10px; }
.box-title { font-size: 18px; margin-bottom: 3px; font-weight: bold; }
.box-subtitle { font-size: 12px; color: #555; }
.rp-unit { font-size: 24px; font-weight: bold; color: var(--pr); }
.rp-paket { font-size: 15px; font-weight: bold; color: var(--pr); }
.bln-paket { font-size: 14px; font-weight: bold; color: var(--c); }
.pill-blue { display: inline-block; background: var(--cp); color: var(--c); padding: 5px 12px; font-size: 11px; font-weight: bold; margin-top: 6px; }

.input-harga { font-size: 24px; font-weight: bold; color: var(--pr); border: 1px dashed #999; background: #fff; padding: 3px 6px; width: 170px; max-width: 100%; border-radius: 5px; text-align: center; }
.input-paket { font-size: 15px; font-weight: bold; color: var(--pr); border: 1px dashed #999; background: #fff; padding: 2px 5px; width: 100px; text-align: center; }

table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
th, td { border: 2.5px solid var(--cb); padding: 8px 12px; vertical-align: top; }
th { background: var(--cg); color: var(--on); text-align: center; font-size: 14px; padding: 8px; }
.td-center { text-align: center; vertical-align: middle; }
.paket-title { font-size: 16px; font-weight: bold; }
.paket-sub { font-size: 12px; color: #777; display: block; margin-top: 2px; }
.paket-desc { font-size: 13px; line-height: 1.35; }
ul { margin: 0; padding-left: 16px; }
li { margin-bottom: 2px; }
.total-price { font-size: 18px; font-weight: bold; color: var(--pr); }

.promo-box { border: 2.5px solid var(--c); margin-bottom: 10px; overflow: hidden; }
.promo-header { background: var(--cg); color: var(--on); text-align: center; font-weight: bold; padding: 8px; font-size: 13px; }
.promo-body { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px 18px; font-weight: bold; font-size: 13px; color: var(--c); }
.footer-box { padding: 8px 14px; margin-bottom: 8px; }
.footer-title { font-weight: bold; margin-bottom: 3px; font-size: 13px; }
.footer-desc { font-size: 12px; color: #444; line-height: 1.35; }

/* ===== Efek pemikat: bintang, jempol, lencana ===== */
.title-box { position: relative; overflow: hidden; }
[data-ik] { display: inline-block; width: 14px; height: 14px; flex: none; vertical-align: -2px; }
.fx { position: absolute; width: var(--z, 14px); height: var(--z, 14px); color: #ffd54a; }
.s1 { top: 6px; left: 10px; --z: 18px; transform: rotate(-12deg); }
.s2 { top: 8px; right: 12px; --z: 13px; transform: rotate(14deg); }
.s3 { bottom: 7px; left: 14px; --z: 12px; transform: rotate(10deg); }
.s4 { bottom: 6px; right: 10px; --z: 18px; transform: rotate(-8deg); }
.s5 { top: 14px; left: 17%; --z: 10px; }
.s6 { bottom: 12px; right: 18%; --z: 10px; }
.trust { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 10px; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--cp); color: var(--c); font-weight: bold; font-size: 12px; padding: 5px 11px; border-radius: 999px; }
.chip .th { color: var(--pr); }
.chip .gs { color: #e0a800; }
.rec { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; padding: 2px 7px; border-radius: 999px; background: #ffd54a; color: #5a3b00; font-size: 10px; font-weight: bold; vertical-align: 2px; }
.rec [data-ik] { width: 11px; height: 11px; vertical-align: 0; }
.inl { color: #ffd54a; width: 13px; height: 13px; margin: 0; }
.promo-header { display: flex; align-items: center; justify-content: center; gap: 6px; }
td .pill-blue { white-space: nowrap; padding: 4px 8px; }
.nofx .fx, .nofx .trust, .nofx .rec, .nofx .inl { display: none; }
@media screen and (prefers-reduced-motion: no-preference) {
  .fx { animation: tw 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .rec { animation: pop 2s ease-in-out infinite; }
  .title-box::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); animation: sh 1.5s .4s 1 ease-out forwards; pointer-events: none; }
  .chip { animation: fin .5s ease-out both; }
  .chip:nth-child(2) { animation-delay: .15s; } .chip:nth-child(3) { animation-delay: .3s; }
  .snap .fx, .snap .rec, .snap .chip { animation: none; }
  .snap .title-box::after { display: none; }
}
@keyframes tw { 0%, 100% { opacity: .4; scale: .7; } 50% { opacity: 1; scale: 1.2; } }
@keyframes pop { 0%, 100% { scale: 1; } 50% { scale: 1.08; } }
@keyframes sh { to { left: 130%; } }
@keyframes fin { from { opacity: 0; translate: 0 6px; } to { opacity: 1; translate: 0 0; } }
.stk .s5, .stk .s6 { display: none; }
.stretch { display: flex; flex-direction: column; justify-content: space-between; }

/* ===== Layout bertumpuk (dipilih otomatis oleh skrip saat layar sempit) ===== */
@media screen {
  .stk .flex-row { flex-direction: column; gap: 8px; }
  .stk .title-box h1 { font-size: 24px; }
  .stk .title-box p { font-size: 13px; }
  .stk .input-harga { width: 100%; max-width: 190px; font-size: 22px; }
  .stk .input-paket { width: 112px; font-size: 16px; }
  .stk .rp-paket { font-size: 16px; }
  .stk table, .stk thead, .stk tbody, .stk tr, .stk td { display: block; }
  .stk thead { display: none; }
  .stk tbody tr { display: grid; grid-template-columns: 1fr 1fr; border: 2.5px solid var(--cb); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .stk td { border: none; padding: 8px 10px; }
  .stk td:nth-child(1), .stk td:nth-child(2) { grid-column: 1 / -1; }
  .stk td:nth-child(2) { padding-top: 0; font-size: 14px; }
  .stk td:nth-child(3), .stk td:nth-child(4) { border-top: 1px solid var(--cb); padding: 6px; }
  .stk td:nth-child(3) { border-right: 1px solid var(--cb); }
  .stk td[data-l]::before { content: attr(data-l); display: block; font-size: 11px; color: #666; font-weight: bold; margin-bottom: 2px; }
  .stk .total-price { font-size: 17px; }
  .stk .promo-body { grid-template-columns: 1fr; padding: 8px 12px; gap: 4px; }
  html.fit, html.fit body { overflow: hidden; height: 100%; }
}
#ov { position: fixed; inset: 0; background: #fff; z-index: 20; display: flex; flex-direction: column; }
#ov[hidden] { display: none; }
#ovImg { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #eee; }
#ovBar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
#ovBar button, #ovBar a { flex: 1 1 45%; text-align: center; text-decoration: none; border: none; border-radius: 8px; padding: 11px 4px; font-size: 14px; font-weight: bold; color: #fff; background: #1fa855; }
#ovNote { font-size: 12px; color: #555; padding: 0 10px 8px; }

/* ===== Cetak ===== */
@media print {
  body { padding: 0 !important; overflow: visible; }
  @page { size: A4 portrait; margin: 0.4cm; }
  .no-print { display: none !important; }
  #wrap { max-width: 950px !important; height: auto !important; overflow: visible; }
  html.fit, html.fit body { overflow: visible !important; height: auto !important; }
  .stretch { display: block !important; min-height: 0 !important; }
  #sheet { transform: none !important; width: auto !important; margin: 0 !important; zoom: 0.8; }
  #sheet .flex-row, #sheet .promo-box, #sheet .footer-box, #sheet tr { break-inside: avoid; page-break-inside: avoid; }
  .fx, .rec, .chip { animation: none !important; }
  .title-box::after { display: none !important; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .input-harga, .input-paket { border: none !important; background: transparent !important; padding: 0 !important; width: auto !important; text-align: left !important; }
}
/* ===== Umum model baru ===== */
.stretch>div{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.vroot{display:flex;flex-direction:column;gap:10px}
.vroot .hero{position:relative;overflow:hidden;text-align:center;padding:16px;margin:0}
.vroot .hero h1{font-size:30px;margin-bottom:4px}
.vroot .hero p{font-size:14px}
.vroot .sec{font-weight:bold;font-size:14px}
.vroot .ft{font-weight:bold;margin-bottom:3px;font-size:13px;color:var(--c)}
.vroot .fd{font-size:12px;color:#444;line-height:1.4}
.vroot .ph{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:bold;font-size:13px;text-align:center}
.vroot .pb{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-weight:bold;font-size:13px;color:var(--c);margin-top:6px}
.vroot ul{padding-left:16px;margin:0}
.vroot li{margin-bottom:2px}
.vroot .us{font-size:11px;color:#555}
.vroot .un{font-weight:bold;color:var(--c)}
.vroot .fi{font-size:12px;color:#555;line-height:1.35}
.vroot .tg{display:inline-block;background:#fff;border:1px solid var(--cb);color:var(--c);border-radius:999px;padding:2px 8px;font-size:11px;margin:2px 3px 0 0}
.vroot .tb{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.vroot .tb small{display:block;font-size:10px;font-weight:bold;color:#666}
.vroot .so{font-size:9px;padding:2px 7px;margin-top:3px}
.vroot .input-harga{font-size:22px;width:150px}
.vroot .input-paket{width:92px;font-size:14px}
.vroot .fts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vroot .ctr{text-align:center}
.stk .vroot .hero h1{font-size:24px}
.stk .vroot .pb,.stk .vroot .fts{grid-template-columns:1fr}
.stk .vroot .input-harga{width:150px;max-width:150px}
.stk .vroot .input-paket{width:100px;font-size:15px}
@media print{.vroot>*,.vroot .tk,.vroot .strip,.vroot .card,.vroot .t{break-inside:avoid;page-break-inside:avoid}}

.v1 .hero{background:var(--cg);color:var(--on);border-radius:18px}
.v1 .sec{color:var(--c);border-bottom:3px solid var(--c);padding-bottom:4px}
.v1 .units{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v1 .u{background:var(--cl);border:2px solid var(--c);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:5px;align-items:center}
.v1 .un{font-size:16px}
.v1 .up{display:flex;align-items:center;justify-content:center;gap:6px}
.v1 .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:stretch}
.v1 .card{border:2px solid var(--cb);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.v1 .card.hot{border-color:var(--c);box-shadow:0 5px 0 var(--c)}
.v1 .ch{background:var(--cg);color:var(--on);text-align:center;padding:9px 6px;font-weight:bold;font-size:15px}
.v1 .card.hot .ch{background:var(--pr);color:#fff}
.v1 .cm{text-align:center;padding:8px 6px 2px}
.v1 .cm .paket-line{margin:0}
.v1 .cf{padding:6px 12px 10px;font-size:12px;flex:1}
.v1 .ct{background:var(--cl);padding:8px;border-top:2px dashed var(--cb);display:flex;flex-direction:column;gap:5px}
.v1 .row{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;font-weight:bold;color:#555}
.v1 .row .total-price{font-size:15px}
.v1 .promo{background:var(--cg);color:var(--on);border-radius:14px;padding:10px}
.v1 .promo .pb{color:var(--on)}
.v1 .foot{border:2px solid var(--c);border-radius:12px;padding:8px 12px}
.stk .v1 .cards,.stk .v1 .units{grid-template-columns:1fr}
.stk .v1 .card.hot{box-shadow:0 3px 0 var(--c)}

.v3 .hero{background:var(--cg);color:var(--on);text-align:left;padding:22px 20px 46px;border-radius:0 0 0 44px}
.v3 .hero::before{content:"";position:absolute;right:-30px;top:0;bottom:0;width:42%;background:rgba(255,255,255,.13);transform:skewX(-18deg)}
.v3 .hero h1,.v3 .hero p,.v3 .sec1{position:relative}
.v3 .hero h1{font-size:36px;line-height:1.05}
.v3 .hero p{max-width:75%}
.v3 .sec1{display:inline-block;margin-top:12px;background:rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;font-weight:bold;font-size:12px}
.v3 .bubs{margin-top:-34px;padding:0 14px;position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v3 .bub{background:#fff;border:3px solid var(--pr);border-radius:22px;box-shadow:0 6px 14px rgba(0,0,0,.2);padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.v3 .up{display:flex;align-items:center;justify-content:center;gap:5px}
.v3 .sec{font-size:15px;color:var(--c);border-left:8px solid var(--pr);padding-left:10px}
.v3 .strip{display:flex;border:2px solid var(--cb);border-radius:16px;overflow:hidden;background:#fff}
.v3 .strip.hot{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr)}
.v3 .sl{width:34%;flex:none;background:var(--cg);color:var(--on);padding:10px 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:3px}
.v3 .sn{font-size:19px;font-weight:bold}
.v3 .sl .bln-paket,.v3 .sl .rp-paket,.v3 .sl .paket-sub{color:var(--on)}
.v3 .sl .paket-sub{opacity:.85}
.v3 .sl .paket-line{margin:0}
.v3 .sm{flex:1;padding:10px 12px;font-size:12px;display:flex;align-items:center;min-width:0}
.v3 .sr{width:34%;flex:none;display:flex;flex-direction:column}
.v3 .sr .tb{flex:1;padding:6px;border-left:2px solid var(--cb)}
.v3 .sr .tb+.tb{border-top:2px solid var(--cb)}
.v3 .promo{background:var(--cl);border:3px solid var(--c);border-radius:16px;padding:10px}
.v3 .promo .ph{color:var(--c)}
.v3 .foot{background:var(--cl);border-radius:12px;padding:8px 12px}
.stk .v3 .hero h1{font-size:28px}
.stk .v3 .hero p{max-width:100%}
.stk .v3 .bubs{grid-template-columns:1fr;padding:0 8px}
.stk .v3 .strip{flex-direction:column}
.stk .v3 .sl,.stk .v3 .sr{width:auto}
.stk .v3 .sr{flex-direction:row}
.stk .v3 .sr .tb+.tb{border-top:0}
.stk .v3 .sr .tb{border-left:0;border-top:2px solid var(--cb)}
.stk .v3 .sr .tb+.tb{border-left:2px solid var(--cb)}

.v7 .pkn{font-weight:bold;color:var(--c);font-size:13px}

.v7 .pr .total-price{font-size:16px}
.v7 .sec{color:var(--c);text-align:center;border-top:3px solid var(--c);padding-top:8px;font-size:13px}

.v7 .dc .pn{font-size:16px;font-weight:bold;color:var(--c)}
.v7 .dc .paket-line{margin:3px 0}
.v7 .promo{background:var(--cg);color:var(--on);border-radius:14px;padding:10px}
.v7 .promo .pb{color:var(--on)}
.v7 .foot{border:2px solid var(--cb);border-radius:12px;padding:8px 12px}

[data-lay="dua"]:not(.stk) > .g1 { grid-area: 1 / 1; } [data-lay="dua"]:not(.stk) > .g2 { grid-area: 2 / 1; }

function hexToHsl(hex) {
  var r = parseInt(hex.substr(1, 2), 16) / 255, g = parseInt(hex.substr(3, 2), 16) / 255, b = parseInt(hex.substr(5, 2), 16) / 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), h = 0, s = 0, l = (mx + mn) / 2, d = mx - mn;
  if (d) {
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [h, s * 100, l * 100];
}

function setHarga(hex) {

}
function hslHex(h, sat, l) {
  h = ((h % 360) + 360) % 360; sat /= 100; l /= 100;
  var a = sat * Math.min(l, 1 - l);
  function f(n) { var k = (n + h / 30) % 12; var c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return ('0' + Math.round(255 * c).toString(16)).slice(-2); }
  return '#' + f(0) + f(8) + f(4);
}
function lumHex(hex) {
  return (0.299 * parseInt(hex.substr(1, 2), 16) + 0.587 * parseInt(hex.substr(3, 2), 16) + 0.114 * parseInt(hex.substr(5, 2), 16)) / 255;
}
function setTema(hex, pr, c2, c3, c4) {
  var okc = /^#[0-9a-f]{6}$/i;
  var hsl = hexToHsl(hex), h = Math.round(hsl[0]), s = Math.round(hsl[1]);
  var sa = Math.min(Math.max(s, 60), 85);
  if (!c2 || !okc.test(c2)) c2 = hslHex(h + 70, sa, Math.min(hsl[2] + 18, 58));
  if (!c3 || !okc.test(c3)) c3 = hslHex(h + 35, sa, Math.min(hsl[2] + 8, 52));
  if (!c4 || !okc.test(c4)) c4 = null;
  var lum = (lumHex(hex) + lumHex(c3) + lumHex(c2) + lumHex(c4 || c3)) / 4;

  st.setProperty('--on', lum > 0.62 ? '#222' : '#fff');

/* lebar rancangan minimum untuk tata letak berdampingan (tanpa menumpuk), per model, agar brosur terisi penuh */
function minWFor() {
  var sh = $('sheet');
  /* templat kartu tetap 600 agar kartu tidak terpotong; selebihnya 480, sama seperti BROSUR-21 */
  if (sh.hasAttribute('data-tpl') && sh.getAttribute('data-lay') === 'kartu') return 600;
  return 480;
}
/* ===== Pas 1 layar: skrip mencari lebar rancangan terbaik agar tulisan paling besar tanpa scroll ===== */
function bestLayout(el, availW, availH) {
  var best = null;
  for (var W = 320; W <= 1100; W += 20) {
    [true, false].forEach(function (stk) {
      if (stk && W > 700) return;
      if (!stk && W < minWFor()) return;
      el.classList.toggle('stk', stk); el.style.width = W + 'px';
      var H = el.offsetHeight, k = Math.min(availW / W, availH / H);
      if (!best || k > best.k + 1e-6) best = { W: W, H: H, k: k, stk: stk };
    });
  }
  el.classList.toggle('stk', best.stk); el.style.width = best.W + 'px';
  return best;
}
/* untuk gambar/video: pilih lebar rancangan TERKECIL yang masih muat tingginya, sehingga lebar layar terisi penuh */
function bestFill(el, SW, SH) {
  var minW = minWFor();
  for (var W = 320; W <= 1100; W += 5) {
    var opts = W <= 700 ? [true, false] : [false];
    for (var i = 0; i < opts.length; i++) {
      var stk = opts[i];
      if (!stk && W < minW) continue;
      el.classList.toggle('stk', stk); el.style.width = W + 'px';
      var H = el.offsetHeight;
      if (H * SW / W <= SH) return { W: W, H: H, k: SW / W, stk: stk };
    }
  }
  return null;
}
/* sisa tinggi layar diisi dengan merenggangkan jarak antar bagian, supaya benar-benar penuh */
function isiTinggi(el, best, k, availH, cap) {
  var extra = Math.max(0, Math.min(availH / k - best.H, best.H * (cap || 0.25)));
  el.classList.add('stretch'); el.style.minHeight = (best.H + extra) + 'px';
  return best.H + extra;
}
function fit() {
  var sheet = $('sheet'), wrap = $('wrap'), de = document.documentElement;
  sheet.style.transform = ''; sheet.style.width = ''; sheet.style.marginLeft = ''; sheet.style.minHeight = ''; wrap.style.height = '';
  sheet.classList.remove('stretch');
  de.classList.remove('fit'); document.body.classList.remove('fit');
  var vw = de.clientWidth, vh = window.innerHeight;
  if (!fitOn) { sheet.classList.toggle('stk', vw < 600); return; }
  de.classList.add('fit'); document.body.classList.add('fit');
  var availW = wrap.clientWidth - 1;
  var availH = vh - $('bar').offsetHeight - ($('themePanel').hidden ? 0 : $('themePanel').offsetHeight + 8) - ($('modelPanel').hidden ? 0 : $('modelPanel').offsetHeight + 8) - 16;
  var best = bestLayout(sheet, availW, availH);
  var k = Math.min(best.k, 1.6);
  var Hf = isiTinggi(sheet, best, k, availH);
  sheet.style.transform = 'scale(' + k + ')';
  sheet.style.marginLeft = Math.max(0, (availW - best.W * k) / 2) + 'px';
  wrap.style.height = (Hf * k) + 'px';
}

/* ===== Gambar brosur (tanpa library) ===== */
var gambarBlob = null;
function buatGambar(mode, cb, blur) {
  try {
    var d = { SW: 360, SH: 780, S: 3 };   /* satu-satunya format: Format HP */
    var SW = d.SW, SH = d.SH, S = d.S, m = 10, sheet = $('sheet');
    var clone = sheet.cloneNode(true);
    clone.removeAttribute('id'); clone.className = (sheet.classList.contains('nofx') ? 'nofx ' : '') + 'snap';
    clone.style.cssText = 'background-color:var(--sbg,#fff);';
    var cs = getComputedStyle(document.documentElement);
    ['--c', '--c2', '--c3', '--cg', '--cl', '--cp', '--cb', '--on', '--pr'].forEach(function (v) { clone.style.setProperty(v, cs.getPropertyValue(v)); });
    var src = sheet.querySelectorAll('input'), dst = clone.querySelectorAll('input');
    for (var i = 0; i < dst.length; i++) {
      var sp = document.createElement('span');
      sp.className = dst[i].className; sp.textContent = src[i].value;
      sp.setAttribute('style', 'border:none;background:transparent;padding:0;width:auto;display:inline-block;text-align:center');
      dst[i].parentNode.replaceChild(sp, dst[i]);
    }
    var holder = document.createElement('div');
    holder.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden';
    holder.appendChild(clone); document.body.appendChild(holder);
    var best = bestLayout(clone, SW - 2 * m, SH - 2 * m);
    var k = Math.min(best.k, 2), W = best.W;
    isiTinggi(clone, best, k, SH - 2 * m);
    var H = clone.offsetHeight;
    var x = (SW - W * k) / 2, y = (SH - H * k) / 2;
    var xml = new XMLSerializer().serializeToString(clone);
    document.body.removeChild(holder);
    var css = ($('appCss') || document.getElementsByTagName('style')[0]).textContent;
    var bg = (getComputedStyle(sheet).getPropertyValue('--sbg') || cs.getPropertyValue('--cl') || '#fff').trim();
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + SW + '" height="' + SH + '">' +
      '<rect width="100%" height="100%" fill="' + bg + '"/>' +
      '<g transform="translate(' + x + ' ' + y + ') scale(' + k + ')">' +
      '<foreignObject x="0" y="0" width="' + W + '" height="' + H + '">' +
      '<div xmlns="http://www.w3.org/1999/xhtml"><style>' + css + '</style>' + xml + '</div></foreignObject></g></svg>';
    var img = new Image();
    img.onload = function () {
      try {
        var c = document.createElement('canvas');
        c.width = Math.round(SW * S); c.height = Math.round(SH * S);
        var cx = c.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
        if (blur) cx.filter = 'blur(' + Math.round(6 * S) + 'px)';
        cx.drawImage(img, 0, 0, c.width, c.height);
        cx.filter = 'none';
        c.toBlob(function (bl) { cb(bl); }, 'image/png');
      } catch (e) { cb(null); }
    };
    img.onerror = function () { cb(null); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  } catch (e) { cb(null); }
}

  batalRekam = function () {
    rekamGen++;

  ujiTampil('Merekam video... 0 / ' + fmtDur(tt) + '. Jangan tutup layar.', false);
